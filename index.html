<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrailRace · Your next adventure</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f5f2;background:#0c1513}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#1e3e31 0%,#0c1513 54%);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:28px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.brand{font-size:24px;font-weight:850;letter-spacing:-1px}.brand span{color:#a6f36a}.tag{color:#a5b7ac;font-size:13px}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 15px;background:#b4f279;color:#152019;font-weight:700}button.secondary{background:#23362e;color:#e8f3e9}.hero{padding:65px 0 35px}.eyebrow{color:#b4f279;font-size:12px;letter-spacing:3px;font-weight:800}h1{font-size:clamp(36px,6vw,68px);line-height:1.08;letter-spacing:-2px;margin:15px 0}h1 em{font-style:normal;color:#b4f279}.lead{color:#adbbb1;max-width:640px;line-height:1.7}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0}.stat{background:#172820;border:1px solid #2a4334;border-radius:14px;padding:18px 22px;min-width:150px}.stat strong{display:block;font-size:27px}.stat small{color:#9ab09e}.section{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:30px 0 16px}h2{font-size:23px;margin:0}.controls{display:flex;gap:9px;flex-wrap:wrap}input,select{background:#16271f;border:1px solid #385142;color:#fff;border-radius:10px;padding:11px;min-width:150px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:#16251e;border:1px solid #2c4334;border-radius:17px;padding:22px;display:flex;flex-direction:column;gap:12px}.card:hover{border-color:#7da45d}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{color:#c3eea4;background:#2b4830;padding:5px 9px;border-radius:30px;font-size:11px}.country{color:#94a99b;font-size:12px}.race-name{font-size:21px;font-weight:750}.race-info{color:#b7c6b9;font-size:14px}.race-actions{display:flex;gap:8px;margin-top:auto;flex-wrap:wrap}.race-actions button{flex:1}.muted{color:#92a598}.note{margin:30px 0;color:#9aafa1;font-size:12px;line-height:1.6}footer{padding:20px 0;border-top:1px solid #2b4234;color:#8ca395;font-size:12px}.empty{padding:30px;border:1px dashed #48604d;border-radius:15px;color:#a7b9aa}.count{font-size:26px;font-weight:800;color:#b4f279}.my-list{display:flex;flex-direction:column;gap:10px}.my-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#16251e;border:1px solid #2c4334;border-radius:12px;padding:14px 18px}.my-row select{min-width:140px}.small{font-size:12px;color:#9eb1a1}@media(max-width:650px){.hero{padding-top:42px}.wrap{padding:18px}.stat{flex:1;min-width:125px}}
.custom-panel{background:#172820;border:1px solid #456449;border-radius:16px;padding:20px;margin:20px 0}.custom-panel h3{margin:0 0 15px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.form-grid label{font-size:12px;color:#b2c6b5;display:flex;flex-direction:column;gap:6px}.form-grid input,.form-grid select{width:100%;min-width:0}.form-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}.hidden{display:none!important}.my-row .small{margin-top:6px}</style></head><body><div class="wrap"><header><div class="brand">▲ Trail<span>Race</span><div class="tag" data-i18n="tag">全球越野赛事管理 · MVP Preview</div></div><button class="secondary" id="lang">EN / 中文</button></header>
<section class="hero"><div class="eyebrow">YOUR NEXT ADVENTURE STARTS HERE</div><h1 data-i18n="headline">不错过每一场<br><em>想跑的比赛。</em></h1><p class="lead" data-i18n="lead">发现赛事、收藏目标、记录报名状态，距离下一场山野冒险还有多少天，一目了然。</p><div class="stats"><div class="stat"><strong id="total">0</strong><small data-i18n="total">演示赛事</small></div><div class="stat"><strong id="saved">0</strong><small data-i18n="saved">我的赛事</small></div><div class="stat"><strong id="upcoming">—</strong><small data-i18n="upcoming">最近赛事倒计时（天）</small></div></div></section>
<div class="section"><h2 data-i18n="discover">发现赛事</h2><div class="controls"><input id="search" data-placeholder-zh="搜索赛事、国家…" data-placeholder-en="Search races, countries…" placeholder="搜索赛事、国家…"><select id="country"><option value="all">全部国家 / All countries</option></select></div></div><div class="grid" id="races"></div>
<div class="section"><h2 data-i18n="mine">我的赛事</h2><span class="small" data-i18n="local">数据暂存于当前浏览器</span></div><div class="form-actions"><button id="toggleForm" data-i18n="addCustom">＋ 自定义添加赛事</button></div><section id="customPanel" class="custom-panel hidden"><h3 id="formTitle">添加赛事</h3><form id="raceForm"><div class="form-grid"><label><span data-i18n="nameLabel">赛事名称 *</span><input id="customName" required maxlength="120"></label><label><span data-i18n="distanceLabel">组别 / 距离 *</span><input id="customDistance" required maxlength="35" placeholder="50K"></label><label><span data-i18n="countryLabel">国家 / 地区</span><input id="customCountry" maxlength="70"></label><label><span data-i18n="dateLabel">比赛日期（可留空）</span><input id="customDate" type="date"></label><label><span data-i18n="statusLabel">当前状态</span><select id="customStatus"><option value="0">关注中</option><option value="1">等待抽签</option><option value="2">已报名</option><option value="3">已完赛</option></select></label></div><div class="form-actions"><button type="submit" data-i18n="saveRace">保存赛事</button><button type="button" class="secondary" id="cancelForm" data-i18n="cancel">取消</button></div></form></section><div id="mine" class="my-list"></div>
<p class="note" data-i18n="disclaimer">演示版：赛事日期与报名信息均为示例/待核实，不代表官方公告。正式上线前将逐条核对赛事官网；本版不提供自动报名提醒。</p><footer>TrailRace MVP · Made for trail runners · 2026</footer></div>
<script>
let races=[
{id:"lavaredo50",name:"Lavaredo Ultra Trail",distance:"50K",country:"Italy",date:"2027-06-25",verified:false},
{id:"utmb",name:"UTMB Mont-Blanc",distance:"UTMB",country:"France",date:null,verified:false},
{id:"ccc",name:"UTMB Mont-Blanc",distance:"CCC",country:"France",date:null,verified:false},
{id:"chianti",name:"Chianti Ultra Trail",distance:"73K",country:"Italy",date:null,verified:false},
{id:"istria",name:"Istria 100 by UTMB",distance:"100K",country:"Croatia",date:null,verified:false},
{id:"mozart",name:"Mozart 100 by UTMB",distance:"50K",country:"Austria",date:null,verified:false},
{id:"andorra",name:"Andorra by UTMB",distance:"50K",country:"Andorra",date:null,verified:false},
{id:"restonica",name:"Restonica Trail",distance:"100K",country:"France",date:null,verified:false},
{id:"transjeju",name:"TransJeju by UTMB",distance:"100K",country:"South Korea",date:null,verified:false}
];
const zh={addCustom:"＋ 自定义添加赛事",nameLabel:"赛事名称 *",distanceLabel:"组别 / 距离 *",countryLabel:"国家 / 地区",dateLabel:"比赛日期（可留空）",statusLabel:"当前状态",saveRace:"保存赛事",cancel:"取消",edit:"编辑",addTitle:"添加赛事",editTitle:"编辑赛事",tag:"全球越野赛事管理 · MVP Preview",headline:"不错过每一场<br><em>想跑的比赛。</em>",lead:"发现赛事、收藏目标、记录报名状态，距离下一场山野冒险还有多少天，一目了然。",total:"演示赛事",saved:"我的赛事",upcoming:"最近赛事倒计时（天）",discover:"发现赛事",mine:"我的赛事",local:"数据暂存于当前浏览器",disclaimer:"演示版：赛事日期与报名信息均为示例/待核实，不代表官方公告。正式上线前将逐条核对赛事官网；本版不提供自动报名提醒。",add:"＋ 加入赛历",remove:"移除",pending:"日期待官方确认",days:"天后",empty:"尚未收藏赛事。点击上方“加入赛历”开始。",status:["关注中","等待抽签","已报名","已完赛"]};
const en={addCustom:"＋ Add your own race",nameLabel:"Race name *",distanceLabel:"Distance / category *",countryLabel:"Country / region",dateLabel:"Race date (optional)",statusLabel:"Status",saveRace:"Save race",cancel:"Cancel",edit:"Edit",addTitle:"Add a race",editTitle:"Edit race",tag:"Global trail race calendar · MVP Preview",headline:"Never miss your<br><em>next race.</em>",lead:"Discover races, save your goals, track registration status and count down to your next adventure.",total:"Demo races",saved:"My races",upcoming:"Days to next race",discover:"Explore races",mine:"My races",local:"Saved only in this browser",disclaimer:"Demo only: dates and registration information are examples or unverified, not official announcements. Automatic registration alerts are not included.",add:"＋ Add to calendar",remove:"Remove",pending:"Date not confirmed",days:"days away",empty:"No saved races yet. Add one above to get started.",status:["Watching","Lottery pending","Registered","Completed"]};
let lang=localStorage.getItem("trailrace_lang")||"zh";let saved={};try{saved=JSON.parse(localStorage.getItem("trailrace_saved")||"{}")}catch(e){};let custom=[];try{custom=JSON.parse(localStorage.getItem("trailrace_custom")||"[]");if(!Array.isArray(custom))custom=[]}catch(e){};races.push(...custom.filter(r=>r&&typeof r.id==="string"&&r.id.startsWith("custom_")));let editing=null;const t=()=>lang==="zh"?zh:en;const days=(date)=>date?Math.ceil((new Date(date+"T00:00:00Z")-new Date())/86400000):null;
function persistCustom(){localStorage.setItem("trailrace_custom",JSON.stringify(custom))}function persist(){localStorage.setItem("trailrace_saved",JSON.stringify(saved));render()}
function render(){const tx=t();document.documentElement.lang=lang==="zh"?"zh-CN":"en";document.querySelectorAll("[data-i18n]").forEach(el=>el.innerHTML=tx[el.dataset.i18n]);document.querySelectorAll("[data-placeholder-zh]").forEach(el=>el.placeholder=el.dataset["placeholder"+(lang==="zh"?"Zh":"En")]);document.getElementById("formTitle").textContent=editing?tx.editTitle:tx.addTitle;document.querySelectorAll("#customStatus option").forEach((el,i)=>el.textContent=tx.status[i]);const country=document.getElementById("country");const selected=country.value;country.innerHTML='<option value="all">'+(lang==="zh"?"全部国家":"All countries")+'</option>'+[...new Set(races.map(r=>r.country))].sort().map(c=>'<option value="'+c+'">'+c+'</option>').join("");country.value=selected||"all";
const q=document.getElementById("search").value.toLowerCase();const list=races.filter(r=>(r.name+" "+r.country+" "+r.distance).toLowerCase().includes(q)&&(country.value==="all"||country.value===r.country));document.getElementById("races").innerHTML=list.map(r=>'<article class="card"><div class="card-top"><span class="pill">'+r.distance+'</span><span class="country">'+r.country+'</span></div><div class="race-name">'+r.name+'</div><div class="race-info">'+(r.date?r.date+" · "+(days(r.date)>=0?days(r.date)+" "+tx.days:tx.pending):tx.pending)+'</div><div class="race-actions"><button data-add="'+r.id+'" class="'+(saved[r.id]?"secondary":"")+'">'+(saved[r.id]?"✓ "+(lang==="zh"?"已加入":"Saved"):tx.add)+'</button></div></article>').join("");
document.getElementById("total").textContent=races.length;document.getElementById("saved").textContent=Object.keys(saved).length;const future=races.filter(r=>saved[r.id]&&days(r.date)!==null&&days(r.date)>=0).map(r=>days(r.date));document.getElementById("upcoming").textContent=future.length?Math.min(...future):"—";
document.getElementById("mine").innerHTML=Object.keys(saved).length?Object.entries(saved).map(([id,status])=>{const r=races.find(x=>x.id===id);if(!r)return"";return '<div class="my-row"><div><strong>'+r.name+' · '+r.distance+'</strong><div class="small">'+(r.date||tx.pending)+'</div></div><div class="controls"><select data-status="'+id+'">'+tx.status.map((s,i)=>'<option value="'+i+'" '+(Number(status)===i?"selected":"")+'>'+s+'</option>').join("")+'</select><button class="secondary" data-remove="'+id+'">'+tx.remove+'</button></div></div>'}).join(""):'<div class="empty">'+tx.empty+'</div>'}
document.addEventListener("click",e=>{const a=e.target.closest("[data-add]");if(a){saved[a.dataset.add]??=0;persist()}const b=e.target.closest("[data-remove]");if(b){const id=b.dataset.remove;delete saved[id];if(id.startsWith("custom_")){custom=custom.filter(r=>r.id!==id);races=races.filter(r=>r.id!==id);persistCustom()}persist()}const c=e.target.closest("[data-edit]");if(c){const id=c.dataset.edit;const r=races.find(x=>x.id===id);if(r){editing=id;document.getElementById("customName").value=r.name;document.getElementById("customDistance").value=r.distance;document.getElementById("customCountry").value=r.country||"";document.getElementById("customDate").value=r.date||"";document.getElementById("customStatus").value=saved[id]??0;document.getElementById("customPanel").classList.remove("hidden");document.getElementById("customPanel").scrollIntoView({behavior:"smooth",block:"center"});render()}}});document.addEventListener("change",e=>{if(e.target.dataset.status){saved[e.target.dataset.status]=Number(e.target.value);persist()}if(e.target.id==="country")render()});const panel=document.getElementById("customPanel");document.getElementById("toggleForm").addEventListener("click",()=>{editing=null;document.getElementById("raceForm").reset();panel.classList.toggle("hidden");render()});document.getElementById("cancelForm").addEventListener("click",()=>{panel.classList.add("hidden");editing=null});document.getElementById("raceForm").addEventListener("submit",e=>{e.preventDefault();const id=editing&&editing.startsWith("custom_")?editing:"custom_"+Date.now().toString(36);const r={id,name:document.getElementById("customName").value.trim(),distance:document.getElementById("customDistance").value.trim(),country:document.getElementById("customCountry").value.trim()||"Other",date:document.getElementById("customDate").value||null,verified:false};if(!r.name||!r.distance)return;if(editing&&!editing.startsWith("custom_")){delete saved[editing]}const i=custom.findIndex(x=>x.id===id);if(i>=0)custom[i]=r;else custom.push(r);races=races.filter(x=>x.id!==id);races.push(r);saved[id]=Number(document.getElementById("customStatus").value);persistCustom();editing=null;panel.classList.add("hidden");document.getElementById("raceForm").reset();persist()});document.getElementById("search").addEventListener("input",render);document.getElementById("lang").addEventListener("click",()=>{lang=lang==="zh"?"en":"zh";localStorage.setItem("trailrace_lang",lang);render()});render();
</script></body></html>
