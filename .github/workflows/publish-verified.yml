name: Publish verified race update
on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "Race ID (utmb, lavaredo50, istria, mozart, andorra, chianti, official_chianti_chiantiultratrail_2027)"
        required: true
        type: choice
        options:
          - utmb
          - lavaredo50
          - istria
          - mozart
          - andorra
          - chianti
          - official_chianti_chiantiultratrail_2027
      headline:
        description: "Exact confirmed announcement summary"
        required: true
        type: string
      official_source:
        description: "Official HTTPS page proving the claim"
        required: true
        type: string
      race_year:
        description: "Year of the race (e.g. 2027)"
        required: true
        type: string
      distance:
        description: "Exact affected distance/category"
        required: true
        type: string
      category:
        description: "Verified announcement topic"
        required: true
        type: choice
        options:
          - registration
          - lottery
          - eligibility
      official_evidence:
        description: "Exact official passage supporting the claim (20+ chars)"
        required: true
        type: string
      confirm_reviewed:
        description: "Type YES after personally checking the official source"
        required: true
        type: string
      review_issue:
        description: "GitHub Issue number reviewed by a human"
        required: true
        type: string
permissions:
  contents: write
  issues: read
concurrency:
  group: trailrace-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish only manually reviewed information
        env:
          RACE_ID: ${{ inputs.race_id }}
          HEADLINE: ${{ inputs.headline }}
          OFFICIAL_SOURCE: ${{ inputs.official_source }}
          RACE_YEAR: ${{ inputs.race_year }}
          DISTANCE: ${{ inputs.distance }}
          CATEGORY: ${{ inputs.category }}
          REVIEW_ISSUE: ${{ inputs.review_issue }}
          VERIFIED_BY: ${{ github.actor }}
          OFFICIAL_EVIDENCE: ${{ inputs.official_evidence }}
          CONFIRM_REVIEWED: ${{ inputs.confirm_reviewed }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/publish_verified.py --race "$RACE_ID" --headline "$HEADLINE" --source "$OFFICIAL_SOURCE" --race-year "$RACE_YEAR" --distance "$DISTANCE" --category "$CATEGORY" --review-issue "$REVIEW_ISSUE" --verified-by "$VERIFIED_BY" --evidence "$OFFICIAL_EVIDENCE" --confirm-reviewed "$CONFIRM_REVIEWED"
      - name: Commit verified updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified-updates.json
          git commit -m "Publish manually verified race announcement"
          git push
