name: TrailRace source check
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: trailrace-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public event pages
        run: python scripts/check_races.py
      - name: Create review Issues for high-priority detections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/create_review_issues.py
      - name: Commit changed monitor data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/race-monitor.json data/page-snapshots.json data/monitor-history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public race page check results"
            git push
          fi
